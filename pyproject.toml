[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "notion-audit-os"
version = "0.1.0"
description = "Local-first CLI audit engine for Notion workspaces."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "notion-audit-os" }]
keywords = ["notion", "audit", "cli", "local-first"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

# v1 is intentionally minimal. Add real deps in later phases.
dependencies = [
    "pydantic>=2.6",
    "jsonschema>=4.18",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]

[project.scripts]
audit = "notion_audit_os.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
